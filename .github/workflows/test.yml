name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked backend and test dependencies
        run: uv sync --project backend --locked --extra test
      - name: Test backend and desktop engine
        run: uv run --project backend --extra test pytest backend/tests omarchy/test_blussh.py -q -o asyncio_default_fixture_loop_scope=function

  models:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift models
        working-directory: ios
        run: swift test
