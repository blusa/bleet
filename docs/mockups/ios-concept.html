<style>
#blussh-ios{--b-bg:light-dark(#f2f2f7,#111216);--b-panel:light-dark(#fff,#1d1e24);--b-text:light-dark(#15161b,#f3f3f7);--b-sub:light-dark(#6b6c76,#aaaab5);--b-line:light-dark(#e6e6ec,#303139);--b-blue:light-dark(#0868d9,#69a5ff);--b-blue-fill:light-dark(#e8f1ff,#1c304b);--b-green:light-dark(#23784c,#68d497);--b-green-fill:light-dark(#e7f5ed,#193629);--b-orange:light-dark(#a15b08,#f3bc6c);--b-orange-fill:light-dark(#fff1db,#3b2d1c);--b-red:light-dark(#b7353d,#ff9199);--b-red-fill:light-dark(#ffedef,#3c2229);--b-black:#080b10;color:var(--b-text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.4;max-width:728px;margin:auto}
#blussh-ios *{box-sizing:border-box}
#blussh-ios button,#blussh-ios input{font:inherit}
#blussh-ios button{cursor:pointer}
#blussh-ios button:focus-visible,#blussh-ios input:focus-visible{outline:3px solid var(--b-blue);outline-offset:3px}
#blussh-ios button:disabled{opacity:.5;cursor:default}
#blussh-ios h1,#blussh-ios h2,#blussh-ios h3,#blussh-ios p{margin:0}
#blussh-ios .demo-nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px;padding-right:82px}
#blussh-ios .demo-nav button{border:0;background:transparent;color:var(--b-sub);border-radius:9px;padding:10px 12px;font-size:13px;font-weight:550;min-height:42px}
#blussh-ios .demo-nav button[aria-pressed=true]{background:var(--b-blue-fill);color:var(--b-blue)}
#blussh-ios .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:stretch}
#blussh-ios .stage>section{display:flex;flex-direction:column}
#blussh-ios .stage>section>.phone{flex:1}
#blussh-ios .screen-caption{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--b-sub);font-size:13px;font-weight:550}
#blussh-ios .screen-caption span:first-child{display:flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:50%;background:var(--b-panel);color:var(--b-sub);font-size:11px}
#blussh-ios .phone{border:5px solid light-dark(#26272b,#393a42);border-radius:43px;background:var(--b-bg);min-height:744px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 24px #00000012;position:relative}
#blussh-ios .statusbar{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 21px;font-size:13px;font-weight:650;position:relative;flex-shrink:0}
#blussh-ios .island{width:92px;height:25px;background:#050507;border-radius:18px;position:absolute;left:50%;transform:translateX(-50%);top:8px}
#blussh-ios .status-right{display:flex;gap:4px;align-items:center;font-size:10px}
#blussh-ios .status-right i{display:block;width:17px;height:8px;border:1.5px solid currentColor;border-radius:3px;position:relative}
#blussh-ios .status-right i:after{content:"";position:absolute;inset:1px;background:currentColor;border-radius:1px}
#blussh-ios .app{display:flex;flex-direction:column;flex:1;min-height:686px}
#blussh-ios .app-content{padding:5px 17px 20px;flex:1}
#blussh-ios .eyebrow{font-size:12px;color:var(--b-sub);font-weight:550;display:flex;align-items:center;gap:6px}
#blussh-ios .topline{display:flex;justify-content:space-between;align-items:center;margin:5px 0 3px}
#blussh-ios .brand{font-size:15px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:6px}
#blussh-ios .brandmark{display:inline-flex;align-items:center;justify-content:center;background:var(--b-blue);color:var(--b-panel);width:23px;height:23px;border-radius:7px;font:650 13px ui-monospace,monospace}
#blussh-ios .iconbutton{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:transparent;color:var(--b-blue);border-radius:12px;flex-shrink:0}
#blussh-ios [data-lucide]{width:18px;height:18px;display:inline-block;vertical-align:middle;flex-shrink:0}
#blussh-ios i.b-icon{font-style:normal;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;font-size:20px;line-height:18px;position:relative}
#blussh-ios i.b-icon[data-lucide=server]{width:17px;height:20px;border:1.4px solid currentColor;border-radius:3px}
#blussh-ios i.b-icon[data-lucide=server]:before{content:"";position:absolute;left:2px;right:2px;top:8px;border-top:1.4px solid currentColor}
#blussh-ios i.b-icon[data-lucide=server]:after{content:"";position:absolute;width:2px;height:2px;left:3px;top:3px;background:currentColor;box-shadow:0 10px 0 currentColor}
#blussh-ios i.b-icon[data-lucide=monitor],#blussh-ios i.b-icon[data-lucide=laptop]{height:13px;width:19px;border:1.5px solid currentColor;border-radius:3px;margin-bottom:4px}
#blussh-ios i.b-icon[data-lucide=monitor]:after,#blussh-ios i.b-icon[data-lucide=laptop]:after{content:"";position:absolute;left:3px;right:3px;bottom:-5px;border-top:1.5px solid currentColor}
#blussh-ios i.b-icon[data-lucide=cpu]{width:15px;height:15px;border:3px double currentColor;border-radius:2px}
#blussh-ios i.b-icon[data-lucide=smartphone]{width:12px;height:20px;border:1.5px solid currentColor;border-radius:3px}
#blussh-ios i.b-icon[data-lucide=wifi]{font-size:12px;width:12px;height:10px;border-top:2px solid currentColor;border-radius:50%}
#blussh-ios i.b-icon[data-lucide=key-round]{font-size:0;width:18px;height:18px}
#blussh-ios i.b-icon[data-lucide=key-round]:before{content:"";width:7px;height:7px;border:1.5px solid currentColor;border-radius:50%;position:absolute;left:0;top:1px}
#blussh-ios i.b-icon[data-lucide=key-round]:after{content:"";width:10px;height:4px;border-top:1.5px solid currentColor;border-right:1.5px solid currentColor;position:absolute;left:6px;top:10px;transform:rotate(40deg)}
#blussh-ios .large-title{font-size:31px;line-height:1.1;letter-spacing:-1.1px;font-weight:750;margin:12px 0 6px}
#blussh-ios .sub{font-size:12px;color:var(--b-sub)}
#blussh-ios .dot{display:inline-block;width:7px;height:7px;background:var(--b-green);border-radius:50%;flex-shrink:0}
#blussh-ios .dot.warn{background:var(--b-orange)}
#blussh-ios .dot.down{background:var(--b-red)}
#blussh-ios .dot.unknown{background:var(--b-sub)}
#blussh-ios .summary{display:flex;gap:6px;align-items:baseline;margin:19px 0 14px}
#blussh-ios .summary strong{font-size:35px;letter-spacing:-1.5px;line-height:1;font-weight:700}
#blussh-ios .summary span{color:var(--b-sub);font-size:13px}
#blussh-ios .summary .attention-count{margin-left:auto;color:var(--b-orange);font-size:12px;font-weight:600}
#blussh-ios .search{height:37px;border-radius:11px;background:light-dark(#e7e7ed,#24252d);display:flex;align-items:center;padding:0 10px;gap:7px;color:var(--b-sub);margin:15px 0 11px}
#blussh-ios .search input{width:100%;min-width:0;border:0;background:transparent;color:var(--b-text);outline-offset:4px;font-size:14px}
#blussh-ios .segments{display:flex;gap:3px;background:light-dark(#e4e4eb,#282930);border-radius:9px;padding:3px;margin:11px 0 18px}
#blussh-ios .segments button{flex:1;min-width:0;min-height:30px;padding:5px 3px;border:0;border-radius:7px;background:transparent;color:var(--b-sub);font-size:12px;font-weight:600}
#blussh-ios .segments button.selected{background:var(--b-panel);color:var(--b-text);box-shadow:0 1px 3px #00000012}
#blussh-ios .section-label{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--b-sub);margin:17px 3px 7px;gap:6px}
#blussh-ios .group{background:var(--b-panel);border-radius:15px;overflow:hidden}
#blussh-ios .host{display:flex;width:100%;align-items:center;gap:10px;background:transparent;border:0;color:var(--b-text);text-align:left;padding:var(--b-row-padding,12px) 12px;min-height:64px}
#blussh-ios .host+.host{border-top:1px solid var(--b-line)}
#blussh-ios .host-icon{width:34px;height:34px;border-radius:10px;background:var(--b-bg);color:var(--b-sub);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#blussh-ios .host-text{flex:1;min-width:0}
#blussh-ios .host-name{font-size:14px;font-weight:650;display:block}

#blussh-ios .host-end{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
#blussh-ios .state-label{display:flex;gap:4px;align-items:center;font-size:10px;color:var(--b-sub)}
#blussh-ios .badge{display:inline-block;color:var(--b-sub);font:550 9px ui-monospace,monospace;border-radius:4px;background:var(--b-bg);padding:2px 4px}
#blussh-ios .bottom-tabs{display:flex;justify-content:space-around;border-top:1px solid var(--b-line);background:var(--b-panel);padding:9px 8px 5px;margin-top:auto}
#blussh-ios .tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--b-sub);font-size:10px;min-width:65px;min-height:45px}

#blussh-ios .homebar{height:21px;background:var(--b-panel);display:flex;justify-content:center;padding-top:7px}
#blussh-ios .homebar:before{content:"";width:104px;height:4px;border-radius:8px;background:var(--b-text)}
#blussh-ios .back{border:0;background:transparent;color:var(--b-blue);padding:5px 0;display:inline-flex;align-items:center;gap:3px;font-size:13px;min-height:35px}
#blussh-ios .detail-heading{display:flex;align-items:center;gap:11px;margin:19px 0 5px}
#blussh-ios .detail-icon{width:51px;height:51px;border-radius:15px;background:var(--b-panel);display:flex;align-items:center;justify-content:center;color:var(--b-sub)}
#blussh-ios .detail-icon [data-lucide]{width:27px;height:27px}
#blussh-ios .detail-heading h1{font-size:28px;font-weight:750;letter-spacing:-.8px}
#blussh-ios .statusline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--b-green);margin-top:3px}

#blussh-ios .action{background:var(--b-blue-fill);color:var(--b-blue);border:0;border-radius:12px;min-height:70px;padding:10px 2px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;font-size:11px;font-weight:650}
#blussh-ios .kv{padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;min-height:43px}

#blussh-ios .row-action{border:0;background:transparent;width:100%;text-align:left;color:var(--b-blue);min-height:45px;display:flex;align-items:center;gap:8px;padding:11px 12px;font-size:12px}
#blussh-ios .row-action+.row-action{border-top:1px solid var(--b-line)}
#blussh-ios .switch{display:inline-block;width:35px;height:22px;position:relative;flex-shrink:0}

#blussh-ios .switch input:checked{background:var(--b-green)}
#blussh-ios .switch input:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;pointer-events:none;transition:transform .15s}

#blussh-ios .footnote{font-size:11px;color:var(--b-sub);margin:9px 3px;line-height:1.5}
#blussh-ios .notice{background:var(--b-orange-fill);color:var(--b-orange);padding:11px 12px;border-radius:12px;font-size:12px;display:flex;align-items:flex-start;gap:8px;margin:15px 0}
#blussh-ios .notice strong{display:block;font-weight:650;margin-bottom:3px}
#blussh-ios .notice p{font-size:11px;line-height:1.5}
#blussh-ios .primary{display:flex;align-items:center;justify-content:center;gap:7px;min-height:45px;border:0;background:var(--b-blue);color:light-dark(#fff,#0d1729);font-size:13px;font-weight:650;border-radius:12px;padding:11px 12px;width:100%}
#blussh-ios .secondary{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border:0;background:var(--b-panel);color:var(--b-blue);font-size:13px;font-weight:600;border-radius:12px;padding:10px 12px;width:100%;margin-top:9px}
#blussh-ios .terminal{background:#0d121b;color:#d8e2f0;border-radius:15px;padding:14px 12px;margin-top:17px;min-height:375px;font:11px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
#blussh-ios .term-title{display:flex;justify-content:space-between;color:#8f9cae;font-size:10px;padding-bottom:11px;border-bottom:1px solid #293241;margin-bottom:13px}
#blussh-ios .term-green{color:#8ce5af}
#blussh-ios .term-dim{color:#8f9cae}

#blussh-ios .term-grid .term-head{color:#8f9cae;border-bottom:1px solid #293241;padding-bottom:5px}
#blussh-ios .terminal input{border:0;background:transparent;color:#d8e2f0;width:100%;font:11px/1.8 ui-monospace,monospace;min-width:0;margin-top:14px}
#blussh-ios .terminal .term-result{white-space:pre-wrap;color:#8ce5af;font-size:10px;margin-top:8px}
#blussh-ios .keybar{display:flex;justify-content:space-between;gap:5px;margin-top:9px}

#blussh-ios .service-logo{background:var(--b-text);color:var(--b-panel);width:43px;height:43px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:750;letter-spacing:-2px}
#blussh-ios .service-tile strong{display:block;font-size:15px}
#blussh-ios .pair-secret{background:var(--b-panel);border:1px solid var(--b-line);border-radius:13px;padding:14px;margin-top:12px;text-align:center}

#blussh-ios .event-mark{width:28px;height:28px;border-radius:9px;background:var(--b-green-fill);color:var(--b-green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#blussh-ios .event-mark.down{background:var(--b-red-fill);color:var(--b-red)}
#blussh-ios .event-mark.warn{background:var(--b-orange-fill);color:var(--b-orange)}
#blussh-ios .event-text{flex:1;min-width:0}
#blussh-ios .event-text strong{font-size:12px;display:block;font-weight:650}
#blussh-ios .event-text p{font-size:11px;color:var(--b-sub);margin-top:3px}
#blussh-ios .event time{color:var(--b-sub);font-size:10px;white-space:nowrap}
#blussh-ios .empty-icon{width:70px;height:70px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:var(--b-panel);color:var(--b-blue);margin:30px auto 22px}

#blussh-ios .center-copy{text-align:center;color:var(--b-sub);font-size:13px;line-height:1.6;margin:0 8px 24px}
#blussh-ios .step{display:flex;gap:11px;align-items:center;padding:13px 12px;font-size:12px}
#blussh-ios .step+.step{border-top:1px solid var(--b-line)}

#blussh-ios .step p{font-size:11px;color:var(--b-sub);margin-top:3px}
#blussh-ios .route{padding:16px;background:var(--b-panel);border-radius:15px;margin-top:17px}
#blussh-ios .route-node{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600}
#blussh-ios .route-link{height:27px;border-left:1px dashed var(--b-line);margin-left:9px;display:flex;align-items:center;padding-left:18px;color:var(--b-sub);font-size:10px}
#blussh-ios .demo-foot{font-size:11px;color:var(--b-sub);margin:15px 0 0;display:flex;gap:7px;flex-wrap:wrap;justify-content:space-between}
#blussh-ios .toast{position:absolute;bottom:94px;left:18px;right:18px;border-radius:12px;background:var(--b-text);color:var(--b-panel);text-align:center;font-size:12px;padding:12px;box-shadow:0 5px 15px #0002;z-index:5}
#blussh-ios [hidden]{display:none!important}
#blussh-ios .widget-stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
#blussh-ios .home-screen{background:light-dark(#d4e0ec,#1f2b3c);min-height:744px;padding:0 17px 14px;display:flex;flex-direction:column;border-radius:43px;border:5px solid light-dark(#26272b,#393a42);overflow:hidden}

#blussh-ios .home-clock{text-align:center;font-size:66px;font-weight:650;letter-spacing:-3px;line-height:1.15;margin-bottom:25px}

#blussh-ios .widget-updated{font-size:9px;color:var(--b-sub);margin-top:auto;padding-top:8px}
#blussh-ios .medium-widget{background:var(--b-panel);border-radius:24px;padding:14px 15px;margin-top:19px}
#blussh-ios .widget-top{display:flex;align-items:center;justify-content:space-between;font-size:11px;gap:8px;margin-bottom:10px}

#blussh-ios .widget-host+.widget-host{border-top:1px solid var(--b-line)}
#blussh-ios .widget-host span{display:flex;align-items:center;gap:6px}
#blussh-ios .widget-host small{font-size:10px;color:var(--b-sub)}
#blussh-ios .home-icons{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 12px;margin-top:25px}
#blussh-ios .home-app{display:flex;align-items:center;flex-direction:column;gap:5px;font-size:9px;color:light-dark(#324052,#ccd5e2)}

/* Craft pass: actual device proportions, readable type and a compact hierarchy.
   Direction: personal fleet instruments; graphite, precise, restrained.
   One signature: each hardware quantity is represented by its own core/slot. */
#blussh-ios{--b-bg:light-dark(#f4f4f7,#0e0e11);--b-panel:light-dark(#ffffff,#1b1b20);--b-sub:light-dark(#63636c,#a1a1ac);--b-line:light-dark(#e4e4e9,#2b2b32);--r-trace:light-dark(#087c67,#8fe2c4)}
#blussh-ios .demo-nav{gap:4px;padding-right:0;margin-bottom:20px}
#blussh-ios .demo-nav button{padding:9px 11px;font-size:12px;font-weight:500;min-height:38px;border-radius:8px}
#blussh-ios .stage{gap:24px}
#blussh-ios .screen-caption{font-size:12px;font-weight:400;margin-bottom:12px}
#blussh-ios .screen-caption>span:first-child{display:none}
#blussh-ios .phone{height:790px;min-height:790px;border-width:5px;border-radius:43px;box-shadow:0 16px 32px #00000014;flex:none!important}
#blussh-ios .statusbar{height:46px;flex-shrink:0;padding-left:22px;padding-right:22px}
#blussh-ios .app{min-height:0;flex:1;overflow:hidden}
#blussh-ios .app-content{padding:4px 16px 16px;min-height:0;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
#blussh-ios .app-content::-webkit-scrollbar{display:none}
#blussh-ios .bottom-tabs{padding:8px 8px 0;flex-shrink:0;background:var(--b-bg)}
#blussh-ios .tab{min-height:39px;font-size:10px;gap:3px}
#blussh-ios .homebar{height:23px;background:var(--b-bg);flex-shrink:0}
#blussh-ios .home-screen{height:790px;min-height:790px;padding:0 16px 12px;background:light-dark(#dde3e9,#252d38)}
#blussh-ios .home-date{font-size:13px;margin-top:20px;margin-bottom:8px}
#blussh-ios .home-clock{font-size:66px;line-height:1;margin-bottom:24px}
#blussh-ios .v-nav{display:flex;align-items:center;justify-content:space-between;min-height:30px;margin:0 0 8px;gap:8px}
#blussh-ios .v-back{display:flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--b-sub);padding:4px 0;font-size:12px;min-height:30px}

#blussh-ios .v-icon-button{border:0;background:transparent;color:var(--b-sub);width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:21px;padding:0}
#blussh-ios .v-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:5px}
#blussh-ios .v-heading h1{font-size:30px;line-height:1.1;font-weight:600;letter-spacing:-.8px}

#blussh-ios .v-status{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--b-sub);margin-bottom:20px}

#blussh-ios .v-top-metrics{display:grid;grid-template-columns:1fr 1.15fr;gap:12px;margin:0 0 16px}
#blussh-ios .v-top-metric{min-width:0;padding:12px;background:var(--b-panel);border-radius:14px}
#blussh-ios .v-top-metric .v-label{font-size:11px;color:var(--b-sub);display:block;margin-bottom:8px}

#blussh-ios .v-top-metric p{font-size:11px;color:var(--b-sub);line-height:1.5;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#blussh-ios .v-top-metric p span{display:block;font-size:11px}
#blussh-ios .v-section-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 8px}
#blussh-ios .v-section-heading h2{font-size:15px;font-weight:500;letter-spacing:0}
#blussh-ios .v-section-heading>span{color:var(--b-sub);font-size:11px}
#blussh-ios .v-gpu-panel{background:var(--b-panel);border-radius:17px;padding:14px;margin-bottom:12px}

#blussh-ios .v-gpu-number-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:16px 0 8px}
#blussh-ios .r-gpu-value{font-size:59px;line-height:.9;letter-spacing:-2px;font-weight:400}
#blussh-ios .r-gpu-value span{font-size:25px;letter-spacing:-.5px;margin-left:3px}
#blussh-ios .v-gpu-secondary{text-align:right;color:var(--b-sub);font-size:11px;line-height:1.7;font-variant-numeric:tabular-nums}
#blussh-ios .r-chart{height:92px;margin:4px 0 0}
#blussh-ios .r-chart text{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:11px}
#blussh-ios .r-chart .r-grid{stroke-width:.6}
#blussh-ios .r-chart .r-trace{stroke-width:2.25}
#blussh-ios .r-chart-times{font:10px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;margin-top:4px}
#blussh-ios .v-vram{padding-top:12px;margin-top:11px;border-top:1px solid var(--b-line)}
#blussh-ios .r-vram-heading{font-size:11px}
#blussh-ios .r-vram-heading strong{font-size:13px;font-weight:500}
#blussh-ios .r-vram-heading strong small{font-size:11px}
#blussh-ios .r-capacity-track{height:4px;margin:8px 0}
#blussh-ios .r-capacity-track span{height:4px}
#blussh-ios .v-vram-foot{display:flex;justify-content:space-between;color:var(--b-sub);font-size:10px;font-variant-numeric:tabular-nums}
#blussh-ios .v-shortcuts{display:flex;gap:8px;margin-top:14px}
#blussh-ios .v-shortcuts button{display:flex;align-items:center;justify-content:center;gap:7px;flex:1;background:var(--b-panel);color:var(--b-text);border:0;border-radius:11px;font-size:12px;min-height:42px;padding:10px 6px}

function resourceChart(g){const w=264,h=100,left=3,right=262,top=9,bottom=89;const pts=g.trace.map((v,i)=>[left+i*(right-left)/(g.trace.length-1),bottom-v*(bottom-top)/100]);const path=pts.map(([x,y],i)=>(i?'L':'M')+x.toFixed(2)+','+y.toFixed(2)).join(' ');const last=pts[pts.length-1];return `<svg class="r-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Uso de GPU ${g.id} en los últimos 15 minutos: de ${g.trace[0]} a ${g.usage} por ciento. Datos de ejemplo."><title>Uso de GPU ${g.id} · Últimos 15 minutos · Porcentaje</title><line class="r-grid" x1="0" y1="9" x2="264" y2="9"/><line class="r-grid" x1="0" y1="49" x2="264" y2="49"/><line class="r-grid" x1="0" y1="89" x2="264" y2="89"/><text x="0" y="6">100%</text><path class="r-trace" d="${path}"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="6" fill="transparent" data-tooltip="${'9:'+String(26+i).padStart(2,'0')} · GPU ${g.id}: ${g.trace[i]}%"/>`).join('')}<circle class="r-plot-dot" cx="${last[0]}" cy="${last[1]}" r="3.5"/><text x="0" y="100">0%</text></svg><div class="r-chart-times"><span>9:26</span><span>Últimos 15 minutos</span><span>9:41</span></div>`;}
function resourceHardware(p){return `<section class="r-hardware-block"><span class="r-label">Procesador · 1 CPU</span><h2>${p.cpu}</h2><p>${p.cores} núcleos${p.unified?'':' · '+p.threads+' hilos'} · ${p.arch}</p><div class="r-chip-diagram" role="img" aria-label="${p.cores} núcleos físicos">${Array.from({length:p.cores},()=>'<span></span>').join('')}</div></section><section class="r-hardware-block"><span class="r-label">${p.unified?'Memoria unificada':'Memoria RAM'}</span><h2>${p.ram} GiB</h2><p>${p.ramModules} · ${p.ramType}</p>${!p.unified&&!p.shared?`<div class="r-module-diagram" role="img" aria-label="${p.ramModules}">${Array.from({length:p.ram/32},()=>'<span>32 GiB</span>').join('')}</div>`:''}</section><section class="r-hardware-block"><span class="r-label">Gráficos · ${p.gpus.length||1} ${p.gpus.length>1?'GPU':'GPU'}</span>${p.gpus.length?p.gpus.map(g=>`<div class="r-hardware-gpu"><div><strong>${g.vendor} ${g.name}</strong><span>GPU ${g.id} · ${g.memoryType}</span></div><div><strong>${g.memory} GiB</strong><span>VRAM dedicada</span></div></div>`).join(''):`<h2>${p.unified?'Apple M4 Pro':p.gpuName}</h2><p>${p.unified?p.gpuCores+' núcleos GPU · Memoria unificada':'GPU integrada · Memoria compartida'}</p>`}</section><p class="footnote">${p.gpus.length>1?'La VRAM se muestra por placa; no se considera una única memoria compartida.':p.unified?'CPU y GPU usan la misma memoria física.':'El inventario y las capacidades se detectan por equipo.'}</p>`;}
function resourceDetail(){const h=selected();const p=resourceProfiles[h.name];const ready=h.state==='online'&&p;const g=ready&&p.gpus.length?p.gpus[Math.min(state.gpuIndex,p.gpus.length-1)]:null;return `<button type="button" class="back" data-action="resource-fleet">${icons('chevron-left')}Equipos</button><div class="r-top"><h1 class="r-title">${h.name}</h1><span class="r-network">${h.source}</span></div><p class="r-status">${dot(h.state)}${h.label}${ready?' · Lectura hace 2 s':''}</p><p class="r-sub" style="margin-top:5px">${p?p.os+' · '+p.arch:h.address}</p><div class="r-local-tabs" role="tablist" aria-label="Información del equipo"><button type="button" data-resource-tab="live" role="tab" aria-selected="${state.resourceTab==='live'}">Recursos</button><button type="button" data-resource-tab="hardware" role="tab" aria-selected="${state.resourceTab==='hardware'}">Hardware</button></div>${!ready?`<div class="r-no-data"><strong>Métricas sin verificar</strong><p>${h.state==='warn'?'El equipo aparece en la VPN, pero el colector no puede acceder por SSH.':'El equipo no está disponible. Conservamos la identidad y la fecha de su última lectura.'}</p></div>`:state.resourceTab==='hardware'?resourceHardware(p):`<div class="r-pair-metrics"><div><span class="r-label">CPU</span><strong class="r-number">${p.cpuUsage}<small>%</small></strong><p class="r-model-caption">${p.shortCPU}<br>${p.cores} núcleos${p.unified?'':' / '+p.threads+' hilos'}</p></div><div><span class="r-label">${p.unified?'Memoria unificada':'RAM'}</span><strong class="r-number">${rFormat(p.ramUsed)}<small>/${p.ram}</small></strong><p class="r-model-caption">GiB en uso · ${p.ramType}<br>${p.ramModules}</p></div></div>${g?`<section class="r-gpu" aria-label="Métricas de GPU ${g.id}"><div class="r-gpu-title"><span>${g.vendor} · ${p.gpus.length} GPU</span><div class="r-device-switch" aria-label="Seleccionar placa gráfica">${p.gpus.map((v,i)=>`<button type="button" data-gpu="${i}" aria-pressed="${i===Math.min(state.gpuIndex,p.gpus.length-1)}">GPU ${v.id}</button>`).join('')}</div></div><h2 class="r-gpu-model">${g.name}</h2><p class="r-gpu-memory">${g.memory} GiB ${g.memoryType} · PCIe</p><div class="r-gpu-value-row"><strong class="r-gpu-value">${g.usage}<span>%</span></strong><p class="r-gpu-value-caption">Uso de GPU<br>Lectura actual</p></div>${resourceChart(g)}<div class="r-vram"><div class="r-vram-heading"><span>VRAM en uso</span><strong>${rFormat(g.used)} <small>/ ${g.memory} GiB</small></strong></div><div class="r-capacity-track" role="meter" aria-label="VRAM ocupada en GPU ${g.id}" aria-valuemin="0" aria-valuemax="${g.memory}" aria-valuenow="${g.used}"><span style="width:${g.used/g.memory*100}%"></span></div><div class="r-gpu-foot"><span>${g.temp} °C · ${g.power} W</span><span>${rFormat(g.memory-g.used)} GiB libres</span></div></div></section>`:`<div class="r-shared"><span class="r-label">${p.unified?'GPU · '+p.gpuCores+' núcleos':'GPU integrada'}</span><h2>${p.unified?'Apple M4 Pro':p.gpuName}</h2><strong>—<small> uso no informado</small></strong><p>El colector no informa utilización de esta GPU.</p><div class="r-vram"><div class="r-vram-heading"><span>${p.unified?'Memoria unificada':'Memoria compartida'}</span><strong>${p.ram} <small>GiB totales</small></strong></div><p style="margin-top:9px">${p.unified?'La GPU usa el mismo bloque de memoria que la CPU.':'Esta GPU usa memoria del sistema.'} No tiene VRAM dedicada separada.</p></div></div>`}<div class="r-actions"><button type="button" data-action="terminal">${icons('terminal')}Terminal SSH</button><button type="button" data-action="t3" ${!h.t3?'disabled':''}>${icons('link')}T3 Code</button></div>`}<p class="r-page-meta"><span>${ready?'Colector SSH · Hace 2 s':'Última lectura no disponible'}</span><span>Ejemplo</span></p>`;}

function polishedOverview(){const featured=resourceProfiles.brak;return `<div class="v-nav"><span class="brand"><span class="brandmark">&gt;_</span>bleet</span><button type="button" class="v-icon-button" data-action="refresh" aria-label="Actualizar">${icons('refresh-cw')}</button></div><div class="v-heading"><h1>Mi red</h1></div><div class="v-fleet-summary"><span>${dot('online')} <strong>4 de 6</strong> disponibles</span><span>2 requieren atención</span></div><button type="button" class="v-fleet-card" data-resource-host="brak"><span class="r-host-heading"><strong>brak</strong><span>${dot('online')}Linux</span></span><span class="r-host-model">AMD Ryzen 9 9950X</span><p class="r-host-capacity">16 núcleos · 128 GiB RAM<br>2 × RTX 5090 · 32 GiB VRAM c/u</p><span class="r-host-metrics"><span><label>CPU</label><strong>34<small>%</small></strong></span><span><label>RAM</label><strong>73,2<small> GiB</small></strong></span><span><label>GPU 0</label><strong class="r-gpu-number">92<small>%</small></strong></span></span></button>${['dexter','buster'].map(name=>{const p=resourceProfiles[name];return `<button type="button" class="v-compact-host" data-resource-host="${name}"><span class="v-compact-top"><strong>${dot('online')}${name}</strong><span>${p.unified?'macOS':'Linux'}</span></span><p>${p.cpu} · ${p.ram} GiB<br>${p.unified?'16 núcleos GPU · Memoria unificada':'RTX 4090 · 24 GiB VRAM'}</p><span class="v-compact-stats"><span>CPU <strong>${p.cpuUsage}%</strong></span><span>RAM <strong>${rFormat(p.ramUsed)} GiB</strong></span><span>GPU <strong>${p.unified?'—':p.gpus[0].usage+'%'}</strong></span></span></button>`;}).join('')}<button type="button" class="v-others" data-action="show-other-hosts"><span>Otros 3 equipos</span><span>Ver todos ›</span></button><p class="v-meta"><span>Tailscale + ZeroTier</span><span>Lectura · 9:41</span></p>`;}
function polishedWidgets(){const original=resourceWidgets();let out=original.replace('class="small-widget"','class="v-widget-small"');const start=out.indexOf('<button type="button" class="r-lock-widget"');const end=out.indexOf('</button>',start)+9;if(start!==-1){out=out.slice(0,start)+`<div class="v-lock-widgets"><button type="button" class="v-lock-widget" data-resource-host="brak"><strong>brak · Ryzen 9</strong><span class="v-lock-value">34<small>% CPU</small></span><p>RAM 73,2 / 128 GiB</p></button><button type="button" class="v-lock-widget" data-widget-gpu="0"><strong>RTX 5090 · GPU 0</strong><span class="v-lock-value">92<small>%</small></span><p>VRAM 26,4 / 32 GiB</p></button></div><p class="v-lock-timestamp">bleet · Última lectura 9:33</p>`+out.slice(end);}return out;}
function polishedT3(){const h=selected().t3?selected():hosts[0];return `${back('Equipos')}<div class="v-heading" style="margin-top:10px"><h1>T3 Code</h1></div><div class="v-t3-mark"><span class="service-logo">t3</span><div><strong>${h.name}</strong><p>${dot('online')} Disponible por HTTPS · Tailscale</p></div></div><button type="button" class="v-primary" data-action="open-t3">Abrir mi sesión ${icons('external-link')}</button><div class="v-section-heading" style="margin-top:22px"><h2>Vincular otro dispositivo</h2></div><div class="group"><button type="button" class="row-action" data-action="scan-t3">${icons('scan-line')}Escanear un QR</button><button type="button" class="row-action" data-action="generate-pair">${icons('key-round')}Crear enlace y QR temporal</button></div>${state.pairShown?`<div class="v-qr-card"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASgAAAEoAQMAAADRyf5aAAAABlBMVEUAAAD///+l2Z/dAAAAAnRSTlP//8i138cAAAAJcEhZcwAACxIAAAsSAdLdfvwAAAEySURBVGiB7dXBDoMwDANQ//9PZ4LYacLKtiPSXKQC7YND5ADilwErKyurZyrkCE3HMmrV6k2xdMhLqZjAak1nOcuUA6w+qSOQeWv1gwJV61urrWpWO322mkp/hXnc/Tv+XmmcS9Cpb1h1lW2KYAgDjCS72OqilksBBjOs9grVpaFJJbbaqfMIrSuMUOtaTaVddW8+2Nraqiu2K9izDN+1a62mYqsqjNy02iksjlATr2E1FLc1VWnXa6yGan2aJ+EWR6uWwmi1bAK9qlYrhSylHlAka9Oqq1ZJFTPX9LGzGqpVVo8ELy8ptKqqou6hLKKA1VBZ07rJvwIzabVRzBvq66ZCW31SIcs/xOxaq4vKbX3r7lJotbo2g0fGklq9KbWobiIYw/4aqyrot2FlZWX1PPUCjxvsnadg5fUAAAAASUVORK5CYII=" alt="QR de ejemplo sin credenciales; apunta a example.com"><p>QR de demostración · Sin credenciales<br>Vigencia de un vínculo real: 1 hora</p><button type="button" class="secondary" data-action="copy-pair">${icons('copy')}Copiar enlace</button></div>`:''}<div class="v-mcp-note"><strong>También disponible por MCP</strong><p><code>create_t3_pairing</code> devuelve enlace, QR o ambos para el equipo elegido. Requiere permiso de emisión T3 del cliente.</p></div><p class="footnote" style="margin-top:13px">El QR y el enlace contienen la misma credencial. El servidor no la guarda; el cliente MCP podría conservarla en su historial.</p>`;}
function hCoreColor(value){return value==null?'var(--h-unknown)':value<10?'var(--h-zero)':value<30?'var(--h-low)':value<60?'var(--h-mid)':value<85?'var(--h-high)':'var(--h-hot)';}
function hCoreCells(p){return p.coreLoads.map((value,index)=>`<span class="h-core" data-core-id="${index}" data-core-load="${value==null?'':value}" data-missing="${value==null}" style="${value==null?'':'background:'+hCoreColor(value)}" aria-label="Núcleo ${index}: ${value==null?'sin datos':value+'% de uso'}"></span>`).join('');}
function hLegend(){return `<div class="h-legend" aria-label="Escala de carga por núcleo, de 0 a 100 por ciento"><span>Baja</span><span class="h-legend-swatches" aria-hidden="true">${['zero','low','mid','high','hot'].map(name=>`<i style="background:var(--h-${name})"></i>`).join('')}</span><span>Alta</span></div>`;}
function hGauge(value,label='Uso de GPU'){const known=value!=null;return `<svg class="h-gauge" viewBox="0 0 128 112" role="img" aria-label="${label}: ${known?value+' por ciento':'sin datos'}"><title>${label}: ${known?value+'%':'sin datos'}</title><circle class="h-gauge-track" cx="64" cy="58" r="42" pathLength="100" stroke-dasharray="75 100" transform="rotate(135 64 58)"/>${known&&value>0?`<circle class="h-gauge-fill" cx="64" cy="58" r="42" pathLength="100" stroke-dasharray="${value*.75} 100" transform="rotate(135 64 58)"/>`:''}<text x="64" y="61" text-anchor="middle">${known?value+'%':'—'}</text><text class="h-gauge-sub" x="64" y="80" text-anchor="middle">${known?'uso GPU':'Sin datos'}</text></svg>`;}
function hMemoryRow(label,used,total,attribute=''){return `<div class="h-memory-row" ${attribute}><div class="h-bar-label"><span>${label}</span><span>${rFormat(used)} / ${total} GiB</span></div><div class="h-bar" role="meter" aria-label="${label}: ${rFormat(used)} de ${total} GiB" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${used}"><span style="width:${used/total*100}%"></span></div></div>`;}
function heatDetail(){const h=selected(),p=resourceProfiles[h.name],ready=h.state==='online'&&p;if(state.resourceTab==='hardware')return polishedInventory(true);if(!ready)return polishedTop(h,p)+`<div class="r-no-data"><strong>Métricas sin verificar</strong><p>${h.state==='warn'?'La red responde, pero no se pudieron obtener muestras del equipo.':'No hay una muestra actual para este equipo.'}</p></div>`;const g=p.gpus.length?p.gpus[Math.min(state.gpuIndex,p.gpus.length-1)]:null;return `${polishedTop(h,p)}<div class="h-resource-grid"><section class="h-unit" aria-label="CPU, carga por núcleo"><div class="h-unit-heading"><span>CPU</span><span>${p.cores} núcleos</span></div><p class="h-model">${p.shortCPU}</p><button type="button" class="h-matrix-button" data-action="cpu-cores" aria-label="Ver utilización de cada uno de los ${p.cores} núcleos"><span class="h-matrix" role="img" aria-label="Mapa de carga de los ${p.cores} núcleos">${hCoreCells(p)}</span></button><p class="h-core-caption">Carga por núcleo</p>${hLegend()}</section><section class="h-unit" aria-label="GPU seleccionada"><div class="h-unit-heading"><span>GPU</span><span>${p.gpus.length||1} ${p.gpus.length>1?'placas':'integrada'}</span></div><p class="h-model">${g?g.name.replace('GeForce ',''):p.unified?'M4 Pro · 16 núcleos':p.gpuName}</p>${g?`<div class="h-gpu-switch" aria-label="Seleccionar placa">${p.gpus.map((gpu,i)=>`<button type="button" data-gpu="${i}" aria-pressed="${i===Math.min(state.gpuIndex,p.gpus.length-1)}">GPU ${gpu.id}</button>`).join('')}</div>`:''}${hGauge(g?g.usage:null,g?'Uso de GPU '+g.id:'Uso de GPU integrada')}<p class="h-gauge-meta">${g?g.memory+' GiB '+g.memoryType:p.unified?'Memoria unificada':'Memoria compartida'}</p></section></div><section class="h-memory" aria-label="Memoria ocupada">${hMemoryRow(p.unified?'Memoria unificada':'RAM',p.ramUsed,p.ram,'data-memory-kind="ram"')}${g?hMemoryRow('VRAM · GPU '+g.id,g.used,g.memory,'data-memory-kind="vram"'):`<p class="h-memory-note">${p.unified?'CPU y GPU comparten esta memoria.':'La GPU usa memoria del sistema.'} No se cuenta una VRAM separada.</p>`}</section><div class="h-more-row"><button type="button" class="h-more-button" data-action="metric-values" aria-expanded="${state.metricValues}">${state.metricValues?'Ocultar':'Ver'} valores detallados <span aria-hidden="true">${state.metricValues?'−':'+'}</span></button><span class="sub" style="font-size:10px">Lectura hace 2 s</span></div>${state.metricValues?`<div class="h-more-panel"><div><span>CPU · Total</span><strong>${p.cpuUsage}%</strong></div>${g?`<div><span>GPU ${g.id} · Temperatura</span><strong>${g.temp} °C</strong></div><div><span>GPU ${g.id} · Potencia</span><strong>${g.power} W</strong></div>`:''}<div><span>Sistema</span><strong>${p.os}</strong></div></div>`:''}<div class="v-shortcuts"><button type="button" data-action="btop">${icons('activity')}Abrir btop</button><button type="button" data-action="t3" ${!h.t3?'disabled':''}>${icons('link')}T3 Code</button></div><p class="v-meta"><span>Colector SSH</span><span>Datos de ejemplo</span></p>`;}
function hCoreSheet(p){const index=Math.min(state.coreIndex,p.cores-1),value=p.coreLoads[index];return `<button type="button" class="h-sheet-backdrop" data-action="close-cores" aria-label="Cerrar detalle de núcleos"></button><section class="h-core-sheet" role="dialog" aria-modal="true" aria-label="Carga por núcleo"><div class="h-sheet-grip" aria-hidden="true"></div><div class="h-sheet-heading"><h2>Carga por núcleo</h2><button type="button" class="v-icon-button" data-action="close-cores" aria-label="Cerrar">×</button></div><p class="h-sheet-sub">${p.cpu} · ${p.cores} núcleos</p><div class="h-core-grid" aria-label="Seleccionar núcleo">${p.coreLoads.map((v,i)=>`<button type="button" class="h-core-tile" data-core-index="${i}" data-hot="${v>=30}" aria-pressed="${i===index}" aria-label="Núcleo ${i}: ${v==null?'sin datos':v+'% de uso'}" style="background:${hCoreColor(v)}">C${i}</button>`).join('')}</div><div class="h-selected-core" aria-live="polite"><span>Núcleo ${index}</span><strong>${value==null?'Sin datos':value+'%'}</strong></div>${hLegend()}<p class="h-memory-note">Color = uso de CPU, no temperatura · Hace 2 s</p></section>`;}
function hFleetBars(p){return `<div class="h-fleet-bars">${[['CPU',p.cpuUsage],['RAM',p.ramUsed/p.ram*100],['GPU',p.gpus.length?p.gpus[0].usage:null]].map(([label,value])=>`<div><span>${label}${value==null?' —':''}</span><div class="h-bar" ${value==null?'role="img" aria-label="GPU sin datos"':`role="meter" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${value}"`}><span style="width:${value==null?0:value}%"></span></div></div>`).join('')}</div>`;}
function heatOverview(){const t=document.createElement('template');t.innerHTML=polishedOverview();const first=t.content.querySelector('.r-host-metrics');if(first)first.outerHTML=hFleetBars(resourceProfiles.brak);t.content.querySelectorAll('.v-compact-stats').forEach((element,index)=>{element.outerHTML=hFleetBars(resourceProfiles[['dexter','buster'][index]]);});return t.innerHTML;}
function heatWidgets(){const p=resourceProfiles.brak,g=p.gpus[Math.min(state.gpuIndex,p.gpus.length-1)];return `<section><div class="screen-caption">Widgets · Recursos visuales</div><div class="home-screen">${statusbar()}<p class="home-date">Sábado, 14 de noviembre</p><p class="home-clock">9:41</p><div class="h-widget-row"><button type="button" class="h-small-widget" data-action="widget-cpu"><span class="h-widget-host">brak <span>CPU</span></span><span class="h-widget-model">Ryzen 9 9950X · 16C</span><span class="h-matrix" role="img" aria-label="Carga de 16 núcleos de CPU">${hCoreCells(p)}</span><span class="h-widget-time">Lectura · 9:33</span></button><button type="button" class="h-small-widget" data-widget-gpu="${g.id}"><span class="h-widget-host">brak <span>GPU ${g.id}</span></span><span class="h-widget-model">RTX 5090 · 32 GiB</span>${hGauge(g.usage,'GPU '+g.id)}<span class="h-widget-time">Lectura · 9:33</span></button></div><div class="h-medium-widget"><div class="h-widget-host">brak <span>Memoria</span></div>${hMemoryRow('RAM',p.ramUsed,p.ram)}${p.gpus.map(v=>hMemoryRow('VRAM · RTX 5090 #'+v.id,v.used,v.memory)).join('')}<div class="h-widget-time"><span>bleet</span><span>Lectura · 9:33</span></div></div><div class="home-icons">${[['mail','Mail'],['calendar','Calendario'],['camera','Cámara'],['settings','Ajustes']].map(([i,t])=>`<div class="home-app"><span>${icons(i)}</span>${t}</div>`).join('')}</div><div class="lock-spacer" style="min-height:12px"></div><div class="homebar" style="background:transparent"></div></div></section><section><div class="screen-caption">Widgets · Pantalla bloqueada</div><div class="home-screen">${statusbar()}<p class="home-date">Sábado, 14 de noviembre</p><p class="home-clock" style="font-size:78px">9:41</p><div class="v-lock-widgets"><button type="button" class="v-lock-widget" data-action="widget-cpu"><strong>brak · CPU</strong><span class="h-lock-matrix" role="img" aria-label="Carga de 16 núcleos">${hCoreCells(p)}</span><p>Ryzen 9 9950X · 16C</p></button><button type="button" class="v-lock-widget" data-widget-gpu="${g.id}"><strong>brak · GPU ${g.id}</strong><div class="h-lock-widget-gpu">${hGauge(g.usage,'GPU '+g.id)}<p>RTX 5090<br>32 GiB</p></div></button></div><p class="v-lock-timestamp">bleet · Última lectura 9:33</p><div class="lock-spacer"></div><div class="lock-shortcuts"><span>${icons('flashlight')}</span><span>${icons('camera')}</span></div><div class="homebar" style="background:transparent"></div></div></section>`;}
function render(){
root.querySelectorAll('[data-pair]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pair===state.pair)));
stage.classList.toggle('widget-stage',state.pair==='widgets');
if(state.pair==='hardware')stage.innerHTML=phone('Uso del equipo',11,heatDetail())+phone('Inventario de hardware',12,polishedInventory());
if(state.pair==='resources')stage.innerHTML=phone('Tu red',11,heatOverview())+phone('Uso del equipo',12,heatDetail());
if(state.pair==='hosts')stage.innerHTML=phone('Equipos · Resumen',1,hostsScreen())+phone('Equipo · Detalle',2,detailScreen());
if(state.pair==='tools')stage.innerHTML=phone('Terminal y monitor',3,terminalScreen())+phone('T3 · Acceso y vinculación',4,polishedT3());
if(state.pair==='network')stage.innerHTML=phone('Actividad · Cambios confirmados',5,activityScreen(),'network')+phone('Red · Acceso privado',6,networkScreen(),'settings');
if(state.pair==='setup')stage.innerHTML=phone('Primera apertura',7,setupScreen())+phone('Sin acceso · Datos guardados',8,offlineScreen());
if(state.pair==='widgets')stage.innerHTML=heatWidgets();
if(state.coreSheet&&state.resourceTab==='live'&&['hardware','resources'].includes(state.pair)){const p=resourceProfiles[selected().name];const target=stage.querySelectorAll('.phone')[state.pair==='hardware'?0:1];if(p&&target)target.insertAdjacentHTML('beforeend',hCoreSheet(p));}
if(globalThis.lucide)globalThis.lucide.createIcons();
}
function toast(message,element){const p=element.closest('.phone,.home-screen')||stage.firstElementChild;const old=p.querySelector('.toast');if(old)old.remove();const n=document.createElement('div');n.className='toast';n.setAttribute('role','status');n.textContent=message;p.appendChild(n);setTimeout(()=>n.remove(),3200);}
root.addEventListener('click',event=>{
const b=event.target.closest('button');if(!b||!root.contains(b))return;
if(b.dataset.coreIndex!==undefined){state.coreIndex=Number(b.dataset.coreIndex);render();const core=root.querySelector('[data-core-index="'+state.coreIndex+'"]');if(core)core.focus({preventScroll:true});return;}
if(b.dataset.resourceHost){state.selected=b.dataset.resourceHost;state.pair='hardware';state.gpuIndex=0;state.resourceTab='live';state.coreSheet=false;render();return;}
if(b.dataset.widgetGpu!==undefined){state.selected='brak';state.pair='hardware';state.gpuIndex=Number(b.dataset.widgetGpu);state.resourceTab='live';state.coreSheet=false;render();return;}
if(b.dataset.gpu!==undefined){state.gpuIndex=Number(b.dataset.gpu);render();return;}
if(b.dataset.resourceTab){state.resourceTab=b.dataset.resourceTab;state.coreSheet=false;render();return;}
if(b.dataset.pair){state.pair=b.dataset.pair;state.coreSheet=false;if(state.pair!=='tools')state.pairShown=false;render();return;}
if(b.dataset.host){state.selected=b.dataset.host;state.pair='hosts';render();return;}
if(b.dataset.filter){state.filter=b.dataset.filter;render();return;}
if(b.dataset.vpn){state.vpn=b.dataset.vpn;render();return;}
const a=b.dataset.action;
if(a==='cpu-cores'){const p=resourceProfiles[selected().name];if(p)state.coreIndex=Math.min(state.coreIndex,p.cores-1);state.coreSheet=true;render();const core=root.querySelector('[data-core-index="'+state.coreIndex+'"]');if(core)core.focus({preventScroll:true});return;}
if(a==='close-cores'){state.coreSheet=false;render();const opener=root.querySelector('[data-action="cpu-cores"]');if(opener)opener.focus({preventScroll:true});return;}
if(a==='widget-cpu'){state.selected='brak';state.pair='hardware';state.resourceTab='live';state.coreSheet=true;render();return;}
if(a==='metric-values'){state.metricValues=!state.metricValues;render();return;}
if(a==='resource-fleet'){state.pair='resources';render();}
else if(['hosts','tab-hosts'].includes(a)){state.pair='hosts';render();}
else if(['settings','tab-settings','tab-network'].includes(a)){state.pair='network';render();}
else if(a==='monitor'){state.pair='hardware';state.resourceTab='live';render();}
else if(a==='btop'){state.pair='tools';render();}
else if(a==='show-other-hosts'){state.pair='hosts';state.filter='all';render();}
else if(['terminal','t3'].includes(a)){state.pair='tools';if(a==='t3'&&!selected().t3)state.selected='brak';render();}
else if(a==='generate-pair'){state.pairShown=true;render();}
else if(a==='refresh'){const last=stage.querySelector('#last-update');if(last)last.textContent='Comprobado recién · Demostración';toast('Vista de ejemplo actualizada',b);}
else if(a==='copy-ssh')toast('Demo: ssh pablo@'+selected().address,b);
else if(a==='copy-pair')toast('Demo: el enlace se copiaría sólo al pedirlo',b);
else if(a==='open-t3')toast('Demo: abriría la sesión de T3 por HTTPS',b);
else if(a==='scan-t3')toast('Demo: escáner de QR de vinculación T3',b);
else if(a==='scan-setup')toast('Demo: escáner del QR del servicio bleetd',b);
else if(a==='manual-setup')toast('Demo: dirección HTTPS y alta del iPhone',b);
else if(a==='favorite')toast('Equipo guardado en favoritos · Demo',b);
else if(a==='test-route')toast('Ruta '+state.vpn+' al servicio verificada · Demo',b);
else if(a==='retry')toast('Demo: el servicio sigue sin responder',b);
else if(a==='close-terminal'){state.pair='hosts';render();}
else if(a==='term-key')toast('Tecla '+b.textContent+' · Demostración',b);
});
root.addEventListener('input',event=>{if(event.target.matches('.search input')){state.query=event.target.value;const list=root.querySelector('#host-list');if(list){list.innerHTML=listMarkup();if(globalThis.lucide)globalThis.lucide.createIcons();}}});
root.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.coreSheet){state.coreSheet=false;render();const opener=root.querySelector('[data-action="cpu-cores"]');if(opener)opener.focus({preventScroll:true});return;}if(event.target.matches('.terminal input')&&event.key==='Enter'){event.preventDefault();event.target.parentElement.querySelector('.term-result').textContent='Demostración: no se ejecutan comandos en tus equipos.';event.target.value='';}});
render();
if(globalThis.Tweak){const design={compact:false};const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--b-row-padding',design.compact?'9px':'12px');}});tweak.addToggle(design,'compact',{label:'Filas compactas'});}
})();
</script>
