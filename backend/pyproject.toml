[project]
name = "bleetd"
version = "0.1.0"
description = "Private Bleet fleet gateway"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "mcp>=1.26,<2", "qrcode[pil]>=8,<9"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-asyncio>=0.25,<2"]

[project.scripts]
bleetd = "bleetd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
